    <script>
        const DRIVE_PDF_URL = "https://drive.google.com/file/d/1-TbHpumZ3cuurtte1zybGgydSc44MPRI/view?usp=sharing";
        const DRIVE_VIDEO_URL = "https://drive.google.com/file/d/1oOmUTp-f-ZaWFQM4Ksf8_e_lGQfdrhyE/view?usp=sharing";

        // PRINCIPAL (Deber + Repaso) 30/10 preguntas
const quizData = [
          { question: 'Relacione el bioelemento con su característica: <br> <img src="https://drive.google.com/thumbnail?id=114CWODZgCOC4FEc-aZLtRVm6YGX60gczHrfIlsUUKSo&sz=w800-h600" width="450" height="350" alt="Descripción">', options: ['1c, 2d, 3b, 4a.', '1c, 2d, 3a, 4b.', '1a, 2c, 3b, 4d', '1a, 2d, 3b, 4c'], answer: '1c, 2d, 3a, 4b.', explanation: 'b) 1c, 2d, 3a, 4b. <br> Sodio &rarr;  presión osmótica (c) <br> Hierro &rarr;  hemoglobina (d) <br> Calcio &rarr;  contracción muscular (a) <br> Magnesio &rarr;  clorofila (b).', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de los siguientes NO es un componente de un nucleótido?', options: ['Base nitrogenada', 'Azúcar pentosa', 'Aminoácido', 'Grupo fosfato'], answer: 'Aminoácido', explanation: 'Es el monómero de las proteínas (unidos por enlaces peptídicos). No forma parte de la estructura química de los nucleótidos ni de los ácidos nucleicos.', multi: 'OFF', maxSelect: 1 },
          { question: 'Complete: Los polisacáridos están formados por la unión de monómeros. Presentan funciones de reserva y estructural como, por ejemplo, _________ tiene función ________.', options: ['la celulosa - estructural.', 'el almidón - de soporte.', 'la celulosa - de síntesis.', 'el glucógeno - de protección.'], answer: 'la celulosa - estructural.', explanation: 'La celulosa es un polisacárido estructural que forma la pared celular de las plantas, proporcionándoles rigidez y soporte.', multi: 'OFF', maxSelect: 1 },
          { question: 'Marque verdadero (V) o falso (F), respecto a los ácidos nucleicos:<br>(  ) La desoxirribosa predomina en el DNA.<br>(  ) Un nucleótido está formado por un fosfato, una base nitrogenada y un azúcar pentosa.<br>(  ) El RNA presenta A, G, C, T.<br>(  ) El DNA siempre se encuentra en el citoplasma.<br>(  ) El DNA es muy estable en el medio ambiente.', options: ['V, V, F, F, F', 'V, V, F, F, V', 'F, V, F, F, V', 'V, F, F, F, V'], answer: 'V, V, F, F, F', explanation: '( V ) La desoxirribosa es la pentosa exclusiva de la estructura del ADN, diferenciándose de la ribosa presente en el ARN. ( V ) Constituye la definición anatómica básica del nucleótido, el monómero fundamental de los ácidos nucleicos. ( F ) El ARN no contiene timina; en su lugar posee uracilo junto a la adenina, guanina y citosina. ( F ) En organismos eucariotas, el ADN genómico se localiza dentro del núcleo celular.( F ) Fuera de la célula, el ADN se degrada con rapidez debido a la radiación ultravioleta, variaciones de pH, humedad y la acción de nucleasas ambientales.', multi: 'OFF', maxSelect: 1 },
          { question: 'Se analiza una muestra de ADN de un pinzón, luego del análisis concluye que el 30% de las bases nitrogenadas son timina. ¿Cuál será el porcentaje de guanina que contiene la muestra?', options: ['30%', '70%', '20%', '50%'], answer: '20%', explanation: 'En el ADN, la cantidad de timina (T) es igual a la de adenina (A), y la cantidad de citosina (C) es igual a la de guanina (G). Si el 30% de las bases son timina, entonces otro 30% serán adenina. Esto suma un 60%, dejando un 40% para citosina y guanina. Como estas dos bases están en igual proporción, cada una representará el 20%.', multi: 'OFF', maxSelect: 1 },
          { question: 'El agua es una biomolécula indispensable en los seres vivos, se encuentra formando aproximadamente el 70% del peso corporal, nunca se encuentra de manera estática, siempre está en movimiento, por lo que una de sus funciones sería:', options: ['Transportar moléculas.', 'Formar sustancias.', 'Ser componente de las membranas.', 'Ser reserva energética.'], answer: 'Transportar moléculas.', explanation: 'El agua es un solvente universal que disuelve una amplia variedad de sustancias, lo que le permite transportar nutrientes, desechos y otras moléculas esenciales en los organismos vivos.', multi: 'OFF', maxSelect: 1 },
          { question: 'Patricio se propone bajar de peso, por lo que cada domingo realiza ayuno. Ante esta situación, el hígado utiliza las reservas de carbohidratos para compensar las necesidades de su organismo. ¿Cómo se llama el carbohidrato que se almacena en el hígado y lo utiliza ante este tipo de situaciones?', options: ['Glucógeno', 'Lactosa', 'Sacarosa', 'Almidón'], answer: 'Glucógeno', explanation: 'El glucógeno es un polisacárido de reserva energética que se almacena principalmente en el hígado y los músculos. Cuando el cuerpo necesita energía, el glucógeno se descompone en glucosa, que es utilizada por las células.', multi: 'OFF', maxSelect: 1 },
          { question: 'Pedro, luego de consumir una bebida energética, observa los ingredientes y le causa curiosidad el término dextrosa. Pregunta sobre este término a su profesor de biología, quien responde que es la principal fuente de energía para las células del organismo, pero en concentraciones elevadas en la sangre puede ser perjudicial para la salud. ¿Cuál es el azúcar que contiene esta bebida?', options: ['Sacarosa', 'Almidón', 'Glucosa', 'Fructosa'], answer: 'Glucosa', explanation: 'La dextrosa es otro nombre para la glucosa, el monosacárido más común y la principal fuente de energía para las células.', multi: 'OFF', maxSelect: 1 },
          { question: 'El DNA y RNA son ácidos nucleicos que presentan diferenciación funcional y estructural. Indique los enunciados correctos respecto al DNA y RNA:<br>I. El DNA almacena la información genética.<br>II. El RNA presenta tres tipos, que intervienen en la formación de proteínas.<br>III. El DNA está presente en el núcleo y los cloroplastos de los vegetales.', options: ['I y II', 'II y III', 'I y III', 'I, II y III'], answer: 'I, II y III', explanation: 'I. Verdadero: El ADN almacena la información genética en su secuencia de bases nitrogenadas.II. Verdadero: Existen tres tipos principales de ARN: mensajero (ARNm), ribosómico (ARNr) y transferencia (ARNt), todos ellos involucrados en la síntesis de proteínas.III. Verdadero: El ADN se encuentra en el núcleo de las células eucariotas, así como en los cloroplastos y mitocondrias de las células vegetales.', multi: 'OFF', maxSelect: 1 },
          { question: 'Durante una campaña de vacunación, María decide vacunar a su hijo contra el sarampión, por lo que el organismo del niño producirá anticuerpos contra los antígenos virales que causan el sarampión.<br>¿Qué tipo de proteína se ha sintetizado en el organismo del niño?', options: ['Enzimática', 'Defensiva', 'Estructural', 'Reguladora'], answer: 'Defensiva', explanation: 'Los anticuerpos son proteínas defensivas producidas por el sistema inmunológico en respuesta a la presencia de antígenos (sustancias extrañas). Los anticuerpos se unen a los antígenos, neutralizándolos y facilitando su eliminación.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de los siguientes lípidos NO es un componente principal de las membranas celulares?', options: ['Fosfolípidos', 'Glucolípidos', 'Colesterol', 'Triglicéridos'], answer: 'Triglicéridos', explanation: 'Son moléculas neutras formadas por una molécula de glicerol unida a tres ácidos grasos. Al ser totalmente apolares e hidrofóbicas, no pueden organizarse para formar bicapas líquidas; su función biológica es el almacenamiento de energía y el aislamiento térmico dentro de los adipocitos.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál es la temperatura corporal que mantienen las personas?', options: ['30°C', '37°C', '15°C', '24°C'], answer: '37°C', explanation: 'La temperatura corporal normal en los seres humanos es de aproximadamente 37°C. Esta temperatura es óptima para el funcionamiento de las enzimas y otros procesos biológicos.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuáles son las biomoléculas orgánicas?', options: ['Las que no presentan un enlace C-C', 'Las que presentan un enlace C-C', 'Las que presentan un enlace C-H', 'Las que presentan un enlace H-N'], answer: 'Las que presentan un enlace C-C', explanation: 'Las biomoléculas orgánicas se caracterizan por tener una estructura basada en carbono, con enlaces carbono-carbono (C-C) formando su esqueleto.', multi: 'OFF', maxSelect: 1 },
          { question: 'Los fosfolípidos son un tipo de lípidos anfipáticos compuestos por una molécula de diglicerol (cola doble) y un grupo fosfato (cabeza). Estos se caracterizan por:', options: ['Tener una cabeza hidrofílica polar y una cola doble hidrofóbica no polar', 'Tener una cabeza y cola doble hidrofílica polar', 'Tener una cabeza hidrofílica polar y una cola doble hidrofílica no polar.'], answer: 'Tener una cabeza hidrofílica polar y una cola doble hidrofóbica no polar', explanation: 'Los fosfolípidos tienen una "cabeza" polar que interactúa con el agua (hidrofílica) y dos "colas" no polares que repelen el agua (hidrofóbicas). Esta estructura anfipática les permite formar bicapas lipídicas, que son la base de las membranas celulares.', multi: 'OFF', maxSelect: 1 },
          { question: 'El beriberi es una enfermedad que provoca debilidad y calambres en los músculos del cuerpo, la cual se produce por deficiencia de la vitamina:', options: ['B1', 'C', 'Ácido fólico', 'Biotina'], answer: 'B1', explanation: 'El beriberi es una enfermedad causada por la deficiencia de vitamina B1 (tiamina). La tiamina es esencial para el metabolismo de los carbohidratos y el funcionamiento del sistema nervioso.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Qué propiedad del agua permite que las plantas puedan transportar nutrientes desde las raíces hasta las hojas?', options: ['Alta capacidad calorífica', 'Capilaridad', 'Densidad', 'Presión atmosférica'], answer: 'Capilaridad', explanation: 'La capilaridad es la capacidad del agua para ascender por tubos estrechos en contra de la gravedad. Esta propiedad permite que el agua y los nutrientes disueltos en ella sean transportados desde las raíces hasta las hojas de las plantas a través de los vasos conductores.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál es la función principal de las proteínas en el cuerpo humano?', options: ['Proveer energía rápida', 'Transportar oxígeno en la sangre', 'Formar estructuras y catalizar reacciones químicas', 'Provocar micción'], answer: 'Formar estructuras y catalizar reacciones químicas', explanation: 'Las proteínas son las biomoléculas más versátiles del organismo. Cumplen un rol estructural clave al constituir el citoesqueleto y formar tejidos como el colágeno y la queratina, y actúan como enzimas encargadas de acelerar y regular la velocidad de las reacciones metabólicas vitales.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Qué característica distintiva tienen los ácidos nucleicos?', options: ['Están formados por monosacáridos', 'Contienen nitrógeno en su estructura', 'Son anfipáticos', 'Son hidrofóbicos'], answer: 'Contienen nitrógeno en su estructura', explanation: 'Los ácidos nucleicos (ADN y ARN) se caracterizan por contener bases nitrogenadas en su estructura. Estas bases nitrogenadas son adenina, guanina, citosina, timina (en el ADN) y uracilo (en el ARN).', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál es una función clave de los carbohidratos en las células?', options: ['Servir como componentes estructurales en las membranas celulares', 'Proveer energía inmediata a través de la glucosa', 'Regular la actividad enzimática'], answer: 'Proveer energía inmediata a través de la glucosa', explanation: 'La glucosa es un carbohidrato simple que es la principal fuente de energía para las células. Se descompone en un proceso llamado glucólisis para liberar energía que las células pueden utilizar.', multi: 'OFF', maxSelect: 1 },
          { question: 'Las vitaminas son biomoléculas esenciales que:', options: ['Proporcionan energía a las células.', 'Forman parte de las membranas celulares.', 'Actúan como coenzimas en reacciones metabólicas.', 'Almacenan información genética.'], answer: 'Actúan como coenzimas en reacciones metabólicas.', explanation: 'Muchas vitaminas, especialmente las hidrosolubles del complejo B funcionan como precursoras de coenzimas o cofactores indispensables para que las enzimas puedan catalizar y acelerar las reacciones metabólicas de las células.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de los siguientes bioelementos NO es considerado primario, a pesar de su abundancia en los seres vivos?', options: ['Carbono (C)', 'Calcio (Ca)', 'Hidrógeno (H)', 'Nitrógeno (N)'], answer: 'Calcio (Ca)', explanation: 'Aunque el calcio es abundante en los seres vivos (especialmente en huesos y dientes), se considera un bioelemento secundario, no primario.', multi: 'OFF', maxSelect: 1 },
          { question: 'La característica principal que hace que el carbono sea la base de la vida es su capacidad para:', options: ['Formar enlaces iónicos fuertes', 'Disolverse fácilmente en agua', 'Formar largas cadenas y anillos complejos', 'Reaccionar explosivamente con el oxígeno'], answer: 'Formar largas cadenas y anillos complejos', explanation: 'El carbono puede formar cuatro enlaces covalentes con otros átomos, incluyendo otros carbonos, lo que le permite crear estructuras moleculares complejas y diversas, esenciales para la vida.', multi: 'OFF', maxSelect: 1 },
          { question: 'Los bioelementos traza, a pesar de su escasa cantidad, son esenciales porque:', options: ['Forman parte de hormonas y enzimas vitales', 'Constituyen la mayor parte de la masa celular', 'Son la fuente principal de energía para las células', 'Regulan la temperatura corporal'], answer: 'Forman parte de hormonas y enzimas vitales', explanation: 'Los bioelementos traza, aunque presentes en pequeñas cantidades, son cofactores esenciales para el funcionamiento de muchas enzimas y hormonas cruciales para el metabolismo y la regulación de procesos biológicos.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de las siguientes moléculas NO es un ejemplo de biomolécula inorgánica?', options: ['Agua (H₂O)', 'Cloruro de sodio (NaCl)', 'Fosfato de calcio (Ca₃(PO₄)₂)', 'Glucosa (C₆H₁₂O₆)'], answer: 'Glucosa (C₆H₁₂O₆)', explanation: 'Pertenece al grupo de los glúcidos o carbohidratos. Al estar sintetizada  por seres vivos a partir de esqueletos carbonados, constituye una molécula orgánica indispensable para la obtención de energía en la respiración celular.', multi: 'OFF', maxSelect: 1 },
          { question: 'La estructura tridimensional de las proteínas es crucial para su función. ¿Qué tipo de enlace estabiliza esta estructura?', options: ['Enlace iónico', 'Enlace covalente', 'Enlace de hidrógeno', 'Enlace metálico'], answer: 'Enlace de hidrógeno', explanation: 'Los enlaces de hidrógeno son interacciones débiles que se forman entre átomos de hidrógeno y átomos electronegativos como el oxígeno o el nitrógeno. Estos enlaces son cruciales para estabilizar la estructura tridimensional de las proteínas, como las hélices alfa y las láminas beta.', multi: 'OFF', maxSelect: 1 },
          { question: 'Los ácidos nucleicos, como el ADN y el ARN, son polímeros de:', options: ['Aminoácidos', 'Monosacáridos', 'Nucleótidos', 'Ácidos grasos'], answer: 'Nucleótidos', explanation: 'Los ácidos nucleicos (ADN y ARN) son polímeros formados por unidades repetitivas llamadas nucleótidos. Cada nucleótido consta de una base nitrogenada, un azúcar pentosa y un grupo fosfato.', multi: 'OFF', maxSelect: 1 },
          { question: 'La desnaturalización de una proteína implica:', options: ['La ruptura de sus enlaces peptídicos.', 'La pérdida de su estructura tridimensional.', 'La formación de enlaces covalentes.', 'La hidrólisis de sus aminoácidos en los organismos.'], answer: 'La pérdida de su estructura tridimensional.', explanation: 'La desnaturalización desorganiza los puentes de hidrógeno, interacciones hidrofóbicas y enlaces iónicos que mantienen la forma espacial nativa de la proteína. Aunque la cadena se despliega y la proteína pierde su función biológica, la estructura primaria (secuencia de aminoácidos) se mantiene intacta.', multi: 'OFF', maxSelect: 1 },
          { question: 'Los lípidos son un grupo diverso de biomoléculas con una característica común:', options: ['Son solubles en agua', 'Son insolubles en solventes orgánicos', 'Son hidrofílicos', 'Son hidrofóbicos'], answer: 'Son hidrofóbicos', explanation: 'Los lípidos son insolubles en agua (hidrofóbicos) debido a su naturaleza no polar. Esta propiedad es esencial para su función en las membranas celulares y como reserva energética.', multi: 'OFF', maxSelect: 1 },
          { question: 'Las enzimas son biocatalizadores esenciales para la vida. ¿Cuál es su naturaleza química?', options: ['Lípidos', 'Carbohidratos', 'Ácidos nucleicos', 'Proteínas'], answer: 'Proteínas', explanation: 'Las enzimas son proteínas que actúan como catalizadores biológicos, acelerando reacciones químicas en los seres vivos sin consumirse en el proceso.', multi: 'OFF', maxSelect: 1 },
          { question: 'El ATP (adenosín trifosfato) es la "moneda energética" de las células. ¿Qué tipo de biomolécula es?', options: ['Nucleótido', 'Proteína', 'Lípido', 'Carbohidrato'], answer: 'Nucleótido', explanation: 'El ATP es un nucleótido modificado que actúa como la principal fuente de energía para las células. Almacena energía en sus enlaces fosfato de alta energía y la libera cuando se hidroliza a ADP (adenosín difosfato).', multi: 'OFF', maxSelect: 1 },
        ];

        // Práctica 20 preguntas
const quizDataExtra = [
          { question: '¿Cuál de los siguientes NO es un componente de un nucleótido?', options: ['Base nitrogenada', 'Azúcar pentosa', 'Aminoácido', 'Grupo fosfato'], answer: 'Aminoácido', explanation: 'Los aminoácidos son los componentes básicos de las proteínas, no de los nucleótidos. Los nucleótidos están formados por una base nitrogenada, un azúcar pentosa y un grupo fosfato.', multi: 'OFF', maxSelect: 1 },
          { question: 'Las proteínas se clasifican en diferentes niveles de estructura. ¿Cuál de ellos describe la secuencia lineal de aminoácidos?', options: ['Estructura primaria', 'Estructura secundaria', 'Estructura terciaria', 'Estructura cuaternaria'], answer: 'Estructura primaria', explanation: 'La estructura primaria de una proteína es la secuencia lineal de aminoácidos unidos por enlaces peptídicos. Esta secuencia determina la forma y función de la proteína.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de los siguientes lípidos NO es un componente principal de las membranas celulares?', options: ['Fosfolípidos', 'Glucolípidos', 'Colesterol', 'Triglicéridos'], answer: 'Triglicéridos', explanation: 'Los triglicéridos son lípidos de almacenamiento de energía y no forman parte de las membranas celulares. Los fosfolípidos, glucolípidos y colesterol son componentes esenciales de las membranas celulares, proporcionando estructura y funciones específicas.', multi: 'OFF', maxSelect: 1 },
          { question: 'La lactosa, el azúcar de la leche, es un disacárido formado por:', options: ['Glucosa + Fructosa', 'Glucosa + Galactosa', 'Glucosa + Glucosa', 'Fructosa + Galactosa'], answer: 'Glucosa + Galactosa', explanation: 'La lactosa es un disacárido formado por la unión de una molécula de glucosa y una molécula de galactosa mediante un enlace glucosídico.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de los siguientes NO es un ejemplo de función de los carbohidratos en los seres vivos?', options: ['Reserva energética', 'Estructural', 'Reconocimiento celular', 'Catálisis enzimática'], answer: 'Catálisis enzimática', explanation: 'La catálisis enzimática es una función de las proteínas, específicamente de las enzimas. Los carbohidratos tienen funciones de reserva energética (almidón, glucógeno), estructural (celulosa, quitina) y reconocimiento celular (glucocálix).', multi: 'OFF', maxSelect: 1 },
          { question: 'Las vitaminas son biomoléculas esenciales que:', options: ['Proporcionan energía a las células', 'Forman parte de las membranas celulares', 'Actúan como coenzimas en reacciones metabólicas', 'Almacenan información genética'], answer: 'Actúan como coenzimas en reacciones metabólicas', explanation: 'Muchas vitaminas son precursoras de coenzimas, moléculas que ayudan a las enzimas a funcionar correctamente en las reacciones metabólicas.', multi: 'OFF', maxSelect: 1 },
          { question: '¿Cuál de los siguientes NO es un ejemplo de proteína fibrosa?', options: ['Colágeno', 'Queratina', 'Elastina', 'Hemoglobina'], answer: 'Hemoglobina', explanation: 'La hemoglobina es una proteína globular que transporta oxígeno en la sangre. Las proteínas fibrosas, como el colágeno, la queratina y la elastina, tienen estructuras alargadas y proporcionan soporte y resistencia.', multi: 'OFF', maxSelect: 1 },

        function isValidEmailFormat(email) {
            const re = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
            return re.test(email) && email.length <= 254 && !email.includes('..') && !email.startsWith('.') && !email.endsWith('.');
        }

        function analyzeEmail(email) {
            const lower = email.toLowerCase().trim();
            if (!lower) return { valid: false, msg: 'Escribe un correo electrónico.' };
            if (!isValidEmailFormat(lower)) return { valid: false, msg: 'Formato inválido. Revisa que tenga @ y un dominio correcto.' };
            const domain = lower.split('@')[1];
            if (!domain || domain.length < 3) return { valid: false, msg: 'Dominio incompleto o inválido.' };
            if (disposableDomains.some(d => domain === d || domain.endsWith('.' + d))) {
                return { valid: false, msg: 'Correo temporal / desechable detectado. Usa un correo real.' };
            }
            const isTrusted = trustedProviders.some(p => domain === p);
            const hasGoodTld = /\.(com|es|net|org|edu|gov|mx|ar|co|uk|de|fr|it|pt|br|cl)$/i.test(domain);
            if (!hasGoodTld && !isTrusted) {
                return { valid: false, msg: 'Dominio poco común o sospechoso. Usa Gmail, Hotmail/Outlook, Yahoo, etc.' };
            }
            let analysisText = '';
            if (domain.includes('hotmail') || domain.includes('outlook') || domain.includes('live.com') || domain.includes('msn.com')) {
                analysisText = 'Análisis: proveedor Microsoft (Hotmail/Outlook) detectado · formato correcto · dominio legítimo';

                analysisText = 'Análisis: proveedor Google (Gmail) detectado · formato correcto · dominio legítimo';
            } else if (isTrusted) {
                analysisText = 'Análisis: proveedor conocido · formato correcto · dominio legítimo';
            } else {
                analysisText = 'Análisis: formato válido · dominio con TLD estándar · no se detectaron patrones de correo temporal';

            return { valid: true, msg: analysisText };

            }
            state.emailAnalysis = 'checking';
            state.emailAnalysisMsg = 'Analizando correo…';
            updateEmailUI();
            clearTimeout(window._emailCheckTimer);
            window._emailCheckTimer = setTimeout(() => {
                const result = analyzeEmail(val);
                state.emailAnalysis = result.valid ? 'valid' : 'invalid';
                state.emailAnalysisMsg = result.msg;
                updateEmailUI();
            }, 600);
        }

        function updateEmailUI() {
            const feedback = document.getElementById('email-feedback');
            const analysis = document.getElementById('email-analysis');
            const input = document.getElementById('email-in');
            if (!feedback || !analysis || !input) return;
            if (state.emailAnalysis === 'checking') {
                feedback.innerHTML = `<span class="text-slate-500 text-sm flex items-center gap-2"><span class="dot-pulse">●</span> Verificando…</span>`;
                analysis.innerHTML = `<p class="text-xs text-slate-400 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            } else if (state.emailAnalysis === 'invalid') {
                feedback.innerHTML = `<span class="text-red-600 text-sm font-semibold">✗ Correo no válido o inexistente</span>`;
                analysis.innerHTML = `<p class="text-xs text-red-500/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-emerald-400', 'border-slate-300');
                input.classList.add('border-red-400');
            } else if (state.emailAnalysis === 'valid') {
                feedback.innerHTML = `<span class="text-emerald-600 text-sm font-semibold">✓ Correo aceptado</span>`;
                analysis.innerHTML = `<p class="text-xs text-emerald-600/80 mt-1">${state.emailAnalysisMsg}</p>`;
                input.classList.remove('border-red-400', 'border-slate-300');
                input.classList.add('border-emerald-400');
            } else {
                feedback.innerHTML = '';
                analysis.innerHTML = '';
                input.classList.remove('border-red-400', 'border-emerald-400');
                input.classList.add('border-slate-300');
            }
        }

        function validaDatos() {
            const n = document.getElementById('name-in').value.trim();
            const e = document.getElementById('email-in').value.trim();
            if (n.length <= 2) {
                alert("Ingresa nombre completo (mínimo 3 caracteres).");
                return;
            }
            const result = analyzeEmail(e);
            state.emailAnalysis = result.valid ? 'valid' : 'invalid';
            state.emailAnalysisMsg = result.msg;
            updateEmailUI();
            if (!result.valid) return;
            state.studentName = n;
            state.studentEmail = e;
            state.view = 'playing';
            if (state.currentMode === 'evaluacion_final') {
                startTimer();
            }
            render();
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function getTimerPhaseClass(remaining) {
            for (const phase of EVAL_TIMER_PHASES) {
                if (remaining >= phase.minSeconds) {
                    return phase.colorClass;
                }
            }
            return EVAL_TIMER_PHASES[EVAL_TIMER_PHASES.length - 1].colorClass;
        }

        function startTimer() {
            stopTimer();
            state.timeLeft = EVAL_TIMER_SECONDS;
            timerInterval = setInterval(() => {
                state.timeLeft--;
                if (state.timeLeft <= 0) {
                    state.timeLeft = 0;
                    stopTimer();
                    state.view = 'results';
                    render();
                    enviarCorreo();
                    return;
                }
                const timerEl = document.getElementById('eval-timer');
                if (timerEl) {
                    timerEl.textContent = formatTime(state.timeLeft);
                    timerEl.className = `px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}`;
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function isMultiQuestion(q) {
            return q.multi === 'ON';
        }

        function arraysEqual(a, b) {
            if (!Array.isArray(a) || !Array.isArray(b)) return false;
            if (a.length !== b.length) return false;
            const sa = [...a].sort();
            const sb = [...b].sort();
            return sa.every((v, i) => v === sb[i]);
        }

        function handleAnswer(idx) {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            const option = currentQ.options[idx];

            if (isMultiQuestion(currentQ)) {
                let selected = Array.isArray(state.selectedAnswer) ? [...state.selectedAnswer] : [];
                const pos = selected.indexOf(option);
                if (pos > -1) {
                    selected.splice(pos, 1);
                } else {
                    if (selected.length >= currentQ.maxSelect) return;
                    selected.push(option);
                }
                state.selectedAnswer = selected;
                render();
            } else {
                if (state.selectedAnswer !== null) return;
                state.selectedAnswer = option;
                state.isAnswerCorrect = (option === currentQ.answer);
                if (state.isAnswerCorrect) state.score++;
                render();
                if (state.isAnswerCorrect) {
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
        }

        function checkMultiAnswer() {
            if (state.isAnswerCorrect !== null) return;
            const currentQ = state.activeQuestions[state.currentQuestion];
            if (!isMultiQuestion(currentQ)) return;
            const selected = Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [];
            if (selected.length === 0) return;
            const correctAnswers = Array.isArray(currentQ.answer) ? currentQ.answer : [currentQ.answer];
            state.isAnswerCorrect = arraysEqual(selected, correctAnswers);
            if (state.isAnswerCorrect) state.score++;
            render();
            if (state.isAnswerCorrect) {
                setTimeout(() => nextQuestion(), 1000);
            }
        }

        function nextQuestion() {
            if (state.currentQuestion + 1 < state.activeQuestions.length) {
                state.currentQuestion++;
                state.selectedAnswer = null;
                state.isAnswerCorrect = null;
                render();
            } else {
                stopTimer();
                state.view = 'results';
                render();
                enviarCorreo();
            }
        }

        function enviarCorreo() {
            if (!state.studentEmail) return;
            state.emailStatus = 'sending';
            render();
            const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
            const totalQ = state.activeQuestions.length;
            let imageUrl = '';
            let mensaje = '';
            if (scorePerc >= 90) {
                imageUrl = 'https://img.icons8.com/color/128/medal2.png';
                mensaje = `¡Excelente trabajo, ${state.studentName}! Obtuviste un resultado sobresaliente.`;
            } else if (scorePerc >= 70) {
                imageUrl = 'https://img.icons8.com/color/128/diploma.png';
                mensaje = `¡Muy bien, ${state.studentName}! Has aprobado con un buen resultado.`;
            } else if (scorePerc >= 50) {
                imageUrl = 'https://img.icons8.com/color/128/ok.png';
                mensaje = `Buen esfuerzo, ${state.studentName}. Sigue practicando para mejorar.`;
            } else {
                imageUrl = 'https://img.icons8.com/color/128/error.png';
                mensaje = `Ánimo, ${state.studentName}. Revisa el material y vuelve a intentarlo.`;
            }
            const params = {
                to_name: state.studentName,
                to_email: state.studentEmail,
                score: scorePerc,
                correct_answers: state.score,
                total_questions: totalQ,
                mode_name: state.currentMode.toUpperCase(),
                image_url: imageUrl,
                mensaje: mensaje,
                fecha: new Date().toLocaleDateString('es-ES', {
                    year: 'numeric', month: 'long', day: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                })
            };
            emailjs.send("service_dhvsi72", "template_cy74x9h", params)
                .then(() => {
                    state.emailStatus = 'success';
                    render();
                })
                .catch((err) => {
                    console.error('Error EmailJS:', err);
                    state.emailStatus = 'error';
                    render();
                });
        }

        function render() {
            const app = document.getElementById('app');
           
            let modeTitle = '';
            let modeDesc = '';
            if (state.currentMode === 'deber') {
                modeTitle = '🧪 Deber';
                modeDesc = 'Resuelve las 30 preguntas del banco en orden.';
            } else if (state.currentMode === 'evaluacion') {
                modeTitle = '📝 Repaso';
                modeDesc = 'Prueba de 10 preguntas seleccionadas al azar.';
            } else if (state.currentMode === 'extra') {
                modeTitle = '📚 Práctica';
                modeDesc = 'Resuelve las 20 preguntas de práctica.';
            } else if (state.currentMode === 'evaluacion_final') {
                modeTitle = '📊 Evaluación';
                modeDesc = 'Resuelve las 16 preguntas de la Evaluación (tiempo límite: 16 min).';
            }
           
            if (state.view === 'quiz_home') {
                app.innerHTML = `
                <div class="text-center py-16 animate-fade-in bg-white rounded-[3rem] shadow-xl border">
                    <h2 class="text-4xl font-black text-slate-800 mb-2">${modeTitle}</h2>
                    <p class="text-slate-500 mb-8 text-lg">${modeDesc}</p>
                    <button onclick="startQuiz()" class="bg-emerald-600 text-white px-12 py-5 rounded-2xl font-black text-xl hover:bg-emerald-700 transition-all">
                        INICIAR
                    </button>
                </div>`;
            }

            if (state.view === 'name_input') {
                app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl animate-fade-in">
                    <h2 class="text-2xl font-black mb-6 text-center">Registro de Estudiante</h2>
                    <input id="name-in" type="text" placeholder="Nombre y Apellido completo" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl mb-4 focus:border-emerald-500 outline-none">
                   
                    <div class="relative mb-1">
                        <input id="email-in" type="email" placeholder="Correo para recibir nota (Gmail, Hotmail…)"
                               class="w-full p-4 bg-slate-50 border border-slate-300 rounded-xl focus:border-emerald-500 outline-none transition-colors"
                               oninput="onEmailInput()" onblur="onEmailInput()">
                    </div>
                   
                    <div id="email-feedback" class="min-h-[22px] mb-1"></div>
                    <div id="email-analysis" class="mb-5"></div>
                   
                    <button onclick="validaDatos()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold hover:bg-slate-800 transition-all">
                        ENTRAR AL TEST
                    </button>
                    <p class="text-center text-[11px] text-slate-400 mt-4">Se verifica formato y se descartan correos temporales. No se envía nada hasta terminar el test.</p>
                </div>`;
                setTimeout(updateEmailUI, 50);
            }

            if (state.view === 'playing') {
                const q = state.activeQuestions[state.currentQuestion];
                const progress = ((state.currentQuestion + 1) / state.activeQuestions.length) * 100;
                const multi = isMultiQuestion(q);
                const selected = multi
                    ? (Array.isArray(state.selectedAnswer) ? state.selectedAnswer : [])
                    : (state.selectedAnswer ? [state.selectedAnswer] : []);

                const multiHint = multi
                    ? `<p class="text-sm text-sky-600 font-semibold mb-4">
                         Selección múltiple · elige ${q.maxSelect} respuesta${q.maxSelect > 1 ? 's' : ''}
                         ${selected.length > 0 ? `(${selected.length}/${q.maxSelect})` : ''}
                       </p>`
                    : '';

                const timerHtml = (state.currentMode === 'evaluacion_final')
                    ? `<div id="eval-timer" class="px-3 py-1.5 rounded-xl border-2 font-black text-sm tabular-nums ${getTimerPhaseClass(state.timeLeft)}">
                           ${formatTime(state.timeLeft)}
                       </div>`
                    : '';

                app.innerHTML = `
                <div class="animate-fade-in">
                    <div class="flex justify-between items-center mb-6 px-4 gap-4">
                        <span class="font-black text-emerald-600">${state.currentQuestion + 1} / ${state.activeQuestions.length}</span>
                        <div class="flex-1 max-w-xs bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all" style="width:${progress}%"></div>
                        </div>
                        ${timerHtml}
                    </div>
                    <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border">
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 leading-tight">${q.question}</h2>
                        ${multiHint}
                        <div class="grid gap-3">
                            ${q.options.map((opt, idx) => {
                                let style = "border-slate-100 bg-slate-50 hover:border-emerald-200";
                                const isSelected = selected.includes(opt);

                                if (state.isAnswerCorrect !== null) {
                                    if (multi) {
                                        const correctSet = Array.isArray(q.answer) ? q.answer : [q.answer];
                                        if (correctSet.includes(opt) && isSelected) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected && !correctSet.includes(opt)) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        } else if (correctSet.includes(opt) && !isSelected) {
                                            style = "border-emerald-300 bg-emerald-50 text-emerald-700";
                                        }
                                    } else {
                                        if (opt === q.answer) {
                                            style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                        } else if (isSelected) {
                                            style = "border-red-500 bg-red-100 text-red-800";
                                        }
                                    }
                                } else if (isSelected) {
                                    if (multi) {
                                        style = "border-sky-400 bg-sky-100 text-sky-800";
                                    } else {
                                        style = "border-emerald-500 bg-emerald-100 text-emerald-800";
                                    }
                                }

                                return `<button onclick="handleAnswer(${idx})" 
                                            class="p-5 text-left border-2 rounded-xl font-bold transition-all ${style}">
                                            ${opt}
                                        </button>`;
                            }).join('')}
                        </div>

                        ${multi && state.isAnswerCorrect === null ? `
                            <button onclick="checkMultiAnswer()" 
                                class="mt-6 w-full py-4 rounded-xl font-bold transition-all
                                ${selected.length === q.maxSelect 
                                    ? 'bg-sky-600 text-white hover:bg-sky-700' 
                                    : 'bg-slate-200 text-slate-400 cursor-not-allowed'}"
                                ${selected.length !== q.maxSelect ? 'disabled' : ''}>
                                Comprobar respuesta (${selected.length}/${q.maxSelect})
                            </button>
                        ` : ''}

                        ${state.selectedAnswer !== null && state.isAnswerCorrect === false ? `
                            <div class="mt-6 p-5 bg-amber-50 border border-amber-200 rounded-xl">
                                <p class="font-bold text-amber-800 mb-2">Explicación:</p>
                                <p class="text-slate-700">${q.explanation}</p>
                            </div>
                            <button onclick="nextQuestion()" class="mt-6 w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all">
                                Siguiente pregunta
                            </button>
                        ` : ''}
                    </div>
                </div>`;
            }

            if (state.view === 'results') {
                const scorePerc = Math.round((state.score / state.activeQuestions.length) * 100);
                app.innerHTML = `
                <div class="max-w-md mx-auto text-center animate-fade-in bg-white p-12 rounded-[3rem] shadow-2xl">
                    <h2 class="text-2xl font-black mb-2">${state.studentName}</h2>
                    <p class="text-slate-400 uppercase text-xs font-bold mb-6">${state.currentMode}</p>
                    <div class="text-7xl font-black text-emerald-600 mb-4">${scorePerc}%</div>
                    <p class="text-lg font-bold text-slate-700 mb-10">${state.score} / ${state.activeQuestions.length} correctas</p>
                    <button onclick="location.reload()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold">VOLVER AL INICIO</button>
                    <p class="mt-6 text-xs font-bold text-slate-400">
                        ${state.emailStatus === 'success' ? '✅ Nota e imagen enviadas al correo' :
                          state.emailStatus === 'error' ? '⚠️ Error al enviar nota e imagen' :
                          '⏳ Enviando nota e imagen al correo...'}
                    </p>
                </div>`;
            }
        }
        render();
    </script>
</body>
</html>
